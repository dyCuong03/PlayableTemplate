# Builds PlayableTemplate on the local Windows self-hosted runner and exports
# the Super HTML playable artifact.
#
# Required runner setup:
#   - Register this machine as a GitHub Actions self-hosted Windows runner.
#   - Add runner labels: self-hosted, windows, playable-template.
#   - Install Cocos Creator 3.8.7.
#   - Set either a GitHub Secret/Variable named COCOS_CREATOR_EXE, or a machine
#     environment variable with the same name, pointing to CocosCreator.exe.
#   - If private SSH submodules are not already accessible on the runner, set a
#     PLAYABLE_SUBMODULE_SSH_KEY secret with read access.
#
# Telegram notifications:
#   - Required secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
#   - The workflow sends the build status, network size report, and GitHub run URL.
#   - It sends each Super HTML network file to Telegram only when the file is <= 5 MB.
#
# Optional repo variables or workflow_dispatch inputs:
#   - ANDROID_LINK, IOS_LINK are applied to constant.STORE_LINK before build.
#   - PACKAGE_NAME, PLATFORM_CAMP, MAX_TRACKING_DURATION_SEC, ENV are applied to
#     constant.TRACKING before build.
#   - PLAYABLE_ID stays branch-specific in assets/configs/constant.ts.

name: PlayableTemplate Super HTML Build

on:
  workflow_dispatch:
    inputs:
      cocos_build_args:
        description: "Optional Cocos Creator build args override. Leave empty to use CI config."
        required: false
        default: ""
      android_link:
        description: "Optional ANDROID_LINK override. Leave empty to use repo variable ANDROID_LINK."
        required: false
        default: ""
      ios_link:
        description: "Optional IOS_LINK override. Leave empty to use repo variable IOS_LINK."
        required: false
        default: ""
      package_name:
        description: "Optional PACKAGE_NAME override. Leave empty to use repo variable PACKAGE_NAME."
        required: false
        default: ""
      platform_camp:
        description: "Optional PLATFORM_CAMP override. Leave empty to use repo variable PLATFORM_CAMP."
        required: false
        default: ""
      max_tracking_duration_sec:
        description: "Optional MAX_TRACKING_DURATION_SEC override. Leave empty to use repo variable MAX_TRACKING_DURATION_SEC."
        required: false
        default: ""
      build_env:
        description: "Optional ENV override. Leave empty to use repo variable ENV."
        required: false
        default: ""
  push:
    paths:
      - "assets/**"
      - "extensions/super-html/**"
      - "settings/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/playable-template-build.yml"

concurrency:
  group: playable-template-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Super HTML
    runs-on: [self-hosted, windows, playable-template]
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    env:
      PROJECT_DIR: ${{ github.workspace }}
      SUPER_HTML_DIR: ${{ github.workspace }}\extensions\super-html
      COCOS_BUILD_ARGS: ${{ inputs.cocos_build_args }}
      COCOS_CREATOR_EXE_CONFIG: ${{ secrets.COCOS_CREATOR_EXE || vars.COCOS_CREATOR_EXE }}
      ANDROID_LINK_CONFIG: ${{ inputs.android_link || vars.ANDROID_LINK }}
      IOS_LINK_CONFIG: ${{ inputs.ios_link || vars.IOS_LINK }}
      PACKAGE_NAME_CONFIG: ${{ inputs.package_name || vars.PACKAGE_NAME }}
      PLATFORM_CAMP_CONFIG: ${{ inputs.platform_camp || vars.PLATFORM_CAMP }}
      MAX_TRACKING_DURATION_SEC_CONFIG: ${{ inputs.max_tracking_duration_sec || vars.MAX_TRACKING_DURATION_SEC }}
      ENV_CONFIG: ${{ inputs.build_env || vars.ENV }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.PLAYABLE_SUBMODULE_SSH_KEY }}

      - name: Resolve build tools
        run: |
          $ErrorActionPreference = "Stop"

          $cocosExe = $env:COCOS_CREATOR_EXE_CONFIG
          if ([string]::IsNullOrWhiteSpace($cocosExe)) {
            $cocosExe = $env:COCOS_CREATOR_EXE
          }
          if ([string]::IsNullOrWhiteSpace($cocosExe)) {
            $command = Get-Command CocosCreator -ErrorAction SilentlyContinue
            if ($command) {
              $cocosExe = $command.Source
            }
          }
          if ([string]::IsNullOrWhiteSpace($cocosExe)) {
            $knownPaths = @(
              "C:\ProgramData\cocos\editors\Creator\3.8.7\CocosCreator.exe"
            )
            foreach ($path in $knownPaths) {
              if (Test-Path -LiteralPath $path) {
                $cocosExe = $path
                break
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($cocosExe) -or -not (Test-Path -LiteralPath $cocosExe)) {
            throw "Cannot find Cocos Creator. Set COCOS_CREATOR_EXE to the full CocosCreator.exe path."
          }

          "COCOS_CREATOR_EXE=$cocosExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node --version
          npm --version
          & $cocosExe --version

      - name: Clean previous build output
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = Join-Path $env:PROJECT_DIR "build"
          if (Test-Path -LiteralPath $buildDir) {
            Remove-Item -LiteralPath $buildDir -Recurse -Force
          }

      - name: Apply build-time constants
        run: |
          $ErrorActionPreference = "Stop"

          @'
          const fs = require("fs");

          const constantPath = "assets/configs/constant.ts";
          let source = fs.readFileSync(constantPath, "utf8");

          function findObjectEnd(text, openIndex) {
              let depth = 0;
              let quote = "";
              let escaped = false;

              for (let index = openIndex; index < text.length; index++) {
                  const char = text[index];

                  if (quote) {
                      if (escaped) {
                          escaped = false;
                      } else if (char === "\\") {
                          escaped = true;
                      } else if (char === quote) {
                          quote = "";
                      }
                      continue;
                  }

                  if (char === "\"" || char === "'" || char === "`") {
                      quote = char;
                      continue;
                  }

                  if (char === "{") {
                      depth++;
                  } else if (char === "}") {
                      depth--;
                      if (depth === 0) {
                          return index;
                      }
                  }
              }

              throw new Error("Could not find object literal end.");
          }

          function getStaticObjectRange(text, name) {
              const pattern = new RegExp(`static\\s+${name}\\s*=\\s*`);
              const match = pattern.exec(text);
              if (!match) {
                  throw new Error(`Could not find static ${name} in ${constantPath}.`);
              }

              const openIndex = text.indexOf("{", match.index + match[0].length);
              if (openIndex === -1) {
                  throw new Error(`Could not find ${name} object literal.`);
              }

              const closeIndex = findObjectEnd(text, openIndex);
              return { openIndex, closeIndex };
          }

          function formatValue(raw, numeric) {
              if (numeric) {
                  const value = Number(raw);
                  if (!Number.isFinite(value)) {
                      throw new Error(`${numeric} must be a valid number.`);
                  }
                  return String(value);
              }

              return JSON.stringify(raw);
          }

          function setObjectProperty(text, objectName, propertyName, valueLiteral) {
              const range = getStaticObjectRange(text, objectName);
              const before = text.slice(0, range.openIndex + 1);
              let body = text.slice(range.openIndex + 1, range.closeIndex);
              const after = text.slice(range.closeIndex);
              const propertyPattern = new RegExp(`(\\n\\s*${propertyName}\\s*:\\s*)[^,\\n}]+(,?)`);

              if (propertyPattern.test(body)) {
                  body = body.replace(propertyPattern, `$1${valueLiteral}$2`);
              } else {
                  const lineEnding = text.includes("\r\n") ? "\r\n" : "\n";
                  const indentMatch = body.match(/\n(\s*)[A-Za-z0-9_]+\s*:/);
                  const indent = indentMatch ? indentMatch[1] : "        ";
                  const needsComma = body.trim().length && !body.trimEnd().endsWith(",");
                  body = body.replace(/\s*$/, `${needsComma ? "," : ""}${lineEnding}${indent}${propertyName}: ${valueLiteral},${lineEnding}    `);
              }

              return before + body + after;
          }

          const updates = [
              ["STORE_LINK", "ANDROID_LINK", process.env.ANDROID_LINK_CONFIG],
              ["STORE_LINK", "IOS_LINK", process.env.IOS_LINK_CONFIG],
              ["TRACKING", "PACKAGE_NAME", process.env.PACKAGE_NAME_CONFIG],
              ["TRACKING", "PLATFORM_CAMP", process.env.PLATFORM_CAMP_CONFIG],
              ["TRACKING", "MAX_TRACKING_DURATION_SEC", process.env.MAX_TRACKING_DURATION_SEC_CONFIG, "MAX_TRACKING_DURATION_SEC"],
              ["TRACKING", "ENV", process.env.ENV_CONFIG],
          ].filter(([, , raw]) => raw && raw.trim());

          for (const [objectName, propertyName, raw, numericName] of updates) {
              source = setObjectProperty(source, objectName, propertyName, formatValue(raw, numericName));
              console.log(`Applied ${objectName}.${propertyName}`);
          }

          if (updates.length) {
              fs.writeFileSync(constantPath, source);
          } else {
              console.log("No shared build-time constants were provided.");
          }
          '@ | node -

      - name: Install Super HTML extension dependencies
        working-directory: ${{ env.SUPER_HTML_DIR }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath "package-lock.json") {
            npm ci
          } else {
            npm install
          }
          npm update

      - name: Verify Super HTML extension
        working-directory: ${{ env.SUPER_HTML_DIR }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path -LiteralPath "src") {
            npx --yes -p typescript@5.4.5 tsc -b
          } else {
            $requiredDist = @(
              "dist\3x\builder.js",
              "dist\3x\hooks.js",
              "dist\3x\main.js",
              "dist\core\build.js"
            )
            foreach ($path in $requiredDist) {
              if (-not (Test-Path -LiteralPath $path)) {
                throw "Super HTML source is absent and required compiled file is missing: $path"
              }
            }
            Write-Host "Super HTML source folder is absent; using checked-in dist files."
          }

      - name: Build Cocos HTML5 and Super HTML
        run: |
          $ErrorActionPreference = "Stop"
          $buildArgs = $env:COCOS_BUILD_ARGS
          if ([string]::IsNullOrWhiteSpace($buildArgs)) {
            $configPath = Join-Path $env:RUNNER_TEMP "cocos-build-config.json"
            $buildConfig = @{
              platform = "web-mobile"
              debug = $false
              nativeCodeBundleMode = "asmjs"
              overwriteProjectSettings = @{
                includeModules = @{
                  "gfx-webgl2" = "on"
                  "physics" = "off"
                  "physics-2d" = "off"
                  "spine" = "off"
                }
              }
              includedModules = @(
                "2d",
                "3d",
                "affine-transform",
                "animation",
                "audio",
                "base",
                "custom-pipeline",
                "dragon-bones",
                "gfx-webgl",
                "graphics",
                "intersection-2d",
                "light-probe",
                "marionette",
                "mask",
                "particle",
                "particle-2d",
                "primitive",
                "profiler",
                "rich-text",
                "skeletal-animation",
                "terrain",
                "tiled-map",
                "tween",
                "ui",
                "ui-skew",
                "video",
                "websocket",
                "webview"
              )
            }
            $buildConfig |
              ConvertTo-Json -Depth 10 |
              Out-File -LiteralPath $configPath -Encoding utf8
            $buildArgs = "configPath=$configPath"
          }

          $argumentList = @(
            "--project",
            $env:PROJECT_DIR,
            "--build",
            $buildArgs
          )

          Write-Host "Starting Cocos Creator build..."
          Write-Host "Project: $env:PROJECT_DIR"
          Write-Host "Build args: $buildArgs"

          $process = Start-Process `
            -FilePath $env:COCOS_CREATOR_EXE `
            -ArgumentList $argumentList `
            -PassThru

          $timeout = [TimeSpan]::FromMinutes(45)
          if (-not $process.WaitForExit([int]$timeout.TotalMilliseconds)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Cocos Creator build timed out after $($timeout.TotalMinutes) minutes."
          }

          $exitCode = $process.ExitCode
          Write-Host "Cocos Creator exited with code $exitCode"

          if ($exitCode -ne 0 -and $exitCode -ne 36) {
            $logDir = Join-Path $env:PROJECT_DIR "temp\logs"
            if (Test-Path -LiteralPath $logDir) {
              Get-ChildItem -LiteralPath $logDir -File |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 3 |
                ForEach-Object {
                  Write-Host "----- $($_.FullName) -----"
                  Get-Content -LiteralPath $_.FullName -Tail 200
                }
            }
            throw "Cocos Creator build failed with exit code $exitCode."
          }

      - name: Locate Super HTML output
        id: output
        run: |
          $ErrorActionPreference = "Stop"

          $superHtmlRoot = Join-Path $env:PROJECT_DIR "build\super-html"
          if (-not (Test-Path -LiteralPath $superHtmlRoot)) {
            $buildRoot = Join-Path $env:PROJECT_DIR "build"
            if (Test-Path -LiteralPath $buildRoot) {
              Write-Host "Existing build outputs:"
              Get-ChildItem -LiteralPath $buildRoot -Recurse -Depth 3 |
                Select-Object FullName,Length,LastWriteTime
            }
            $logDir = Join-Path $env:PROJECT_DIR "temp\logs"
            if (Test-Path -LiteralPath $logDir) {
              Get-ChildItem -LiteralPath $logDir -File |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 3 |
                ForEach-Object {
                  Write-Host "----- $($_.FullName) -----"
                  Get-Content -LiteralPath $_.FullName -Tail 200
                }
            }
            throw "Super HTML output was not found at $superHtmlRoot. Check that the extension onAfterBuild hook ran."
          }

          $htmlFiles = Get-ChildItem -LiteralPath $superHtmlRoot -Recurse -File -Filter "*.html"
          if (-not $htmlFiles) {
            throw "Super HTML output exists, but no .html file was found under $superHtmlRoot."
          }

          $branch = "${{ github.ref_name }}" -replace "[^A-Za-z0-9._-]", "-"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $artifactBase = "playable-template-$branch-$sha"
          $artifactDir = Join-Path $env:RUNNER_TEMP "playable-template-artifact"
          $zipPath = Join-Path $env:RUNNER_TEMP "$artifactBase.zip"

          if (Test-Path -LiteralPath $artifactDir) {
            Remove-Item -LiteralPath $artifactDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $artifactDir | Out-Null
          Copy-Item -LiteralPath $superHtmlRoot -Destination (Join-Path $artifactDir "super-html") -Recurse

          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $artifactDir "super-html") -DestinationPath $zipPath -Force

          "artifact_name=$artifactBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "super_html_root=$superHtmlRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare network Telegram payload
        id: networks
        run: |
          $ErrorActionPreference = "Stop"

          $superHtmlRoot = "${{ steps.output.outputs.super_html_root }}"
          $limitBytes = 5MB
          $networkFiles = Get-ChildItem -LiteralPath $superHtmlRoot -Recurse -File |
            Where-Object { $_.Extension -in @(".html", ".zip") } |
            Sort-Object DirectoryName,Name

          if (-not $networkFiles) {
            throw "No network .html or .zip files were found under $superHtmlRoot."
          }

          $items = @()
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("Network file size check (limit: 5 MB)") | Out-Null

          foreach ($file in $networkFiles) {
            $relativePath = [System.IO.Path]::GetRelativePath($superHtmlRoot, $file.FullName)
            $parts = $relativePath -split "[\\/]"
            $network = $parts[0]
            $sizeMb = [Math]::Round($file.Length / 1MB, 2)
            $pass = $file.Length -le $limitBytes
            $status = if ($pass) { "[PASS]" } else { "[FAIL]" }

            $items += [pscustomobject]@{
              network = $network
              name = $file.Name
              path = $file.FullName
              relative_path = $relativePath
              size_bytes = $file.Length
              size_mb = $sizeMb
              pass = $pass
            }

            $lines.Add("$status $network / $($file.Name) - $sizeMb MB") | Out-Null
          }

          $passCount = ($items | Where-Object { $_.pass }).Count
          $failCount = ($items | Where-Object { -not $_.pass }).Count
          $manifestPath = Join-Path $env:RUNNER_TEMP "super-html-network-files.json"
          $reportPath = Join-Path $env:RUNNER_TEMP "super-html-network-report.txt"

          $items | ConvertTo-Json -Depth 5 | Out-File -LiteralPath $manifestPath -Encoding utf8
          $lines | Out-File -LiteralPath $reportPath -Encoding utf8

          "manifest_path=$manifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "report_path=$reportPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pass_count=$passCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "fail_count=$failCount" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "total_count=$($items.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Get-Content -LiteralPath $reportPath | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload Super HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.output.outputs.artifact_name }}
          path: ${{ steps.output.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Notify Telegram success
        if: success()
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID)) {
            Write-Warning "Telegram secrets are missing; skipping notification."
            return
          }

          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $artifactName = "${{ steps.output.outputs.artifact_name }}"
          $report = Get-Content -LiteralPath "${{ steps.networks.outputs.report_path }}" -Raw
          $message = @"
          PlayableTemplate build succeeded
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Actor: ${{ github.actor }}
          Artifact: $artifactName
          Network files: ${{ steps.networks.outputs.pass_count }}/${{ steps.networks.outputs.total_count }} pass under 5 MB
          Run: $runUrl

          $report
          "@

          Invoke-RestMethod `
            -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
            -Method Post `
            -Body @{
              chat_id = $env:TELEGRAM_CHAT_ID
              text = $message
              disable_web_page_preview = "true"
            } | Out-Null

          $networkFiles = @(Get-Content -LiteralPath "${{ steps.networks.outputs.manifest_path }}" -Raw | ConvertFrom-Json)
          foreach ($networkFile in $networkFiles) {
            if (-not $networkFile.pass) {
              Write-Warning "Skipping $($networkFile.relative_path) because it is larger than 5 MB."
              continue
            }

            curl.exe -sS -X POST `
              "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendDocument" `
              -F "chat_id=$env:TELEGRAM_CHAT_ID" `
              -F "caption=PlayableTemplate $($networkFile.network): $($networkFile.name) ($($networkFile.size_mb) MB)" `
              -F "document=@$($networkFile.path)" | Out-Null

            Start-Sleep -Milliseconds 800
          }

      - name: Notify Telegram failure
        if: failure()
        run: |
          $ErrorActionPreference = "Continue"
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID)) {
            Write-Warning "Telegram secrets are missing; skipping notification."
            return
          }

          $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $message = @"
          PlayableTemplate build failed
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Actor: ${{ github.actor }}
          Run: $runUrl
          "@

          Invoke-RestMethod `
            -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" `
            -Method Post `
            -Body @{
              chat_id = $env:TELEGRAM_CHAT_ID
              text = $message
              disable_web_page_preview = "true"
            } | Out-Null
